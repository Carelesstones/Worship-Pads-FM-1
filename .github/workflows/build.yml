name: Compile FM-1 Worship Firmware

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: windows-latest
    
    steps:
    - name: Checkout your custom code
      uses: actions/checkout@v4

    - name: Clone the official M-VAVE SDK
      run: git clone https://github.com/m-vave/fm1_open.git sdk

    - name: Inject your C++ file into the SDK
      run: |
        Remove-Item -Path ".\sdk\app\main.c" -ErrorAction SilentlyContinue
        Copy-Item -Path ".\ai_studio_code.cpp" -Destination ".\sdk\app\main.cpp" -Force

    - name: Download and Install JieLi Toolchain
      run: |
        Invoke-WebRequest -Uri "https://pkgman.jieliapp.com/s/win-toolchain" -OutFile "jieli_installer.exe"
        # Force the NSIS installer to run silently and install to C:\JL
        Start-Process -FilePath ".\jieli_installer.exe" -ArgumentList "/S", "/D=C:\JL" -Wait -NoNewWindow
        
    - name: Compile the Firmware
      run: |
        cd sdk
        # Find exactly where the silent installer dropped the compiler
        $ClangExe = Get-ChildItem -Path "C:\JL" -Filter "clang.exe" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
        if ($null -eq $ClangExe) { throw "Toolchain failed to extract properly." }
        
        $env:FM1_PI32_TOOLCHAIN = $ClangExe.Directory.Parent.FullName
        .\sdk\Build.ps1 -FirmwareOnly

    - name: Upload the final .fwsc file
      uses: actions/upload-artifact@v4
      with:
        name: FM1-Ambient-Pads
        path: sdk/**/*.fwsc
