name: Compile FM-1 Worship Firmware

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout your custom code
      uses: actions/checkout@v4

    - name: Clone the fm1-core community template
      run: git clone https://github.com/rgrvmusic/fm1-core.git sdk

    - name: Inject C++ code and Forced Bluetooth Stubs
      run: |
        # Create the stubs with attributes forcing the compiler to keep them
        cat << 'EOF' > stubs.h
        extern "C" {
            __attribute__((used)) void connectivity_w182_bluetooth_start(void) {}
            __attribute__((used)) void audio_app_bluetooth_open(void) {}
            __attribute__((used)) const char* bt_get_local_name(void) { return "FM-1 Pads"; }
            __attribute__((used)) void* bt_get_mac_addr(void) { static char mac[6]={0}; return (void*)mac; }
        }
        EOF
        
        # Combine the stubs at the TOP of your C++ file to avoid syntax conflicts
        cat stubs.h ./ai_studio_code.cpp > ./sdk/examples/ambient.cpp
        
        cd sdk
        # Point the build script back to the .cpp file
        sed -i 's/examples\/sine\.c/examples\/ambient.cpp/' tools/build.py

    - name: Setup JieLi Linux Toolchain
      run: |
        wget -qO jieli-linux.tar.xz "https://pkgman.jieliapp.com/s/linux-toolchain"
        mkdir -p /opt/jieli
        tar -xf jieli-linux.tar.xz -C /opt/jieli
        CLANG_BIN=$(find /opt/jieli -name clang | head -n 1)
        TOOLCHAIN_DIR=$(dirname $(dirname "$CLANG_BIN"))
        echo "FM1_PI32_TOOLCHAIN=$TOOLCHAIN_DIR" >> $GITHUB_ENV

    - name: Compile the Firmware
      run: |
        cd sdk
        python3 tools/build.py

    - name: Upload the final .fwsc file
      uses: actions/upload-artifact@v4
      with:
        name: FM1-Ambient-Pads
        path: "sdk/**/*.fwsc"
