name: Compile FM-1 Worship Firmware

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: windows-latest
    
    steps:
    - name: Checkout your custom code
      uses: actions/checkout@v4

    - name: Clone the official M-VAVE SDK
      run: git clone https://github.com/m-vave/fm1_open.git sdk

    - name: Inject your C++ file into the SDK
      run: |
        Remove-Item -Path ".\sdk\app\main.c" -ErrorAction SilentlyContinue
        Copy-Item -Path ".\ai_studio_code.cpp" -Destination ".\sdk\app\main.cpp" -Force

    - name: Download and Extract JieLi Toolchain
      run: |
        Invoke-WebRequest -Uri "https://pkgman.jieliapp.com/s/win-toolchain" -OutFile "jieli_installer.exe"
        # Bypass the graphical installer entirely by extracting the raw files
        7z x jieli_installer.exe -o"C:\JL_temp" -y
        
    - name: Compile the Firmware
      run: |
        cd sdk
        # Dynamically search the extracted files for the compiler
        $ClangExe = Get-ChildItem -Path "C:\JL_temp" -Filter "clang.exe" -Recurse | Select-Object -First 1
        $Pi32Dir = $ClangExe.Directory.Parent.FullName
        
        # Tell the M-VAVE script exactly where it is
        $env:FM1_PI32_TOOLCHAIN = $Pi32Dir
        .\sdk\Build.ps1 -FirmwareOnly

    - name: Upload the final .fwsc file
      uses: actions/upload-artifact@v4
      with:
        name: FM1-Ambient-Pads
        path: sdk/**/*.fwsc
