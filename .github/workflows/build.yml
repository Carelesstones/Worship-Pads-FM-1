name: Compile FM-1 Worship Firmware

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout your custom code
      uses: actions/checkout@v4

    - name: Clone the fm1-core community template
      run: git clone https://github.com/rgrvmusic/fm1-core.git sdk

    - name: Inject Custom Code and Bluetooth Stubs
      run: |
        # Overwrite the default example file so the build script natively finds it
        cp ./ai_studio_code.cpp ./sdk/examples/sine.c
        
        # Safely inject the Bluetooth stubs into a core C file to guarantee linking
        cat << 'EOF' >> ./sdk/platform/hooks.c
        
        void connectivity_w182_bluetooth_start(void) {}
        void audio_app_bluetooth_open(void) {}
        const char* bt_get_local_name(void) { return "FM-1 Pads"; }
        void* bt_get_mac_addr(void) { static char mac[6]={0}; return (void*)mac; }
        EOF

    - name: Setup Toolchain and Compiler Wrapper
      run: |
        wget -qO jieli-linux.tar.xz "https://pkgman.jieliapp.com/s/linux-toolchain"
        mkdir -p /opt/jieli
        tar -xf jieli-linux.tar.xz -C /opt/jieli
        CLANG_BIN=$(find /opt/jieli -name clang | head -n 1)
        TOOLCHAIN_DIR=$(dirname $(dirname "$CLANG_BIN"))
        echo "FM1_PI32_TOOLCHAIN=$TOOLCHAIN_DIR" >> $GITHUB_ENV
        
        # Trick the compiler into building the disguised .c file as C++
        CLANG_DIR=$(dirname "$CLANG_BIN")
        mv "$CLANG_BIN" "$CLANG_DIR/clang_real"
        
        cat << EOF > "$CLANG_BIN"
        #!/bin/bash
        if [[ "\$*" == *"sine.c"* ]]; then
            exec "$CLANG_DIR/clang_real" -xc++ "\$@"
        else
            exec "$CLANG_DIR/clang_real" "\$@"
        fi
        EOF
        chmod +x "$CLANG_BIN"

    - name: Compile the Firmware
      run: |
        cd sdk
        python3 tools/build.py

    - name: Upload the final .fwsc file
      uses: actions/upload-artifact@v4
      with:
        name: FM1-Ambient-Pads
        path: "sdk/**/*.fwsc"
