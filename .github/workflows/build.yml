name: Compile FM-1 Worship Firmware

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: windows-latest
    
    steps:
    - name: Checkout your custom code
      uses: actions/checkout@v4

    - name: Clone the fm1-core community template
      run: git clone https://github.com/rgrvmusic/fm1-core.git sdk

    - name: Inject Custom C Code
      run: |
        Copy-Item -Path ".\ai_studio_code.c" -Destination ".\sdk\examples\sine.c" -Force

    - name: Download and Setup Toolchain
      run: |
        # Replace this URL with the direct link to your hosted toolchain zip
        Invoke-WebRequest -Uri "YOUR_HOSTED_ZIP_URL" -OutFile "pi32.zip"
        Expand-Archive -Path "pi32.zip" -DestinationPath "C:\JL\pi32" -Force
        echo "FM1_PI32_TOOLCHAIN=C:\JL\pi32" >> $env:GITHUB_ENV

    - name: Compile the Firmware
      run: |
        cd sdk
        python tools/build.py

    - name: Upload the final .fwsc file
      uses: actions/upload-artifact@v4
      with:
        name: FM1-Ambient-Pads
        path: "sdk/**/*.fwsc"
