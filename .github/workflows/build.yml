name: Package JieLi Toolchain

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  package:
    runs-on: windows-latest
    
    steps:
    - name: Download and Extract
      run: |
        choco install innoextract -y --no-progress
        Invoke-WebRequest -Uri "https://pkgman.jieliapp.com/s/win-toolchain" -OutFile "jieli.exe"
        innoextract jieli.exe -d "C:\JL" || 7z x jieli.exe -o"C:\JL" -y

    - name: Package pi32 Folder
      run: |
        $ClangExe = Get-ChildItem -Path "C:\JL" -Filter "clang.exe" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
        $Pi32Path = $ClangExe.Directory.Parent.FullName
        Compress-Archive -Path "$Pi32Path\*" -DestinationPath "pi32.zip" -Force

    - name: Output the Zip
      uses: actions/upload-artifact@v4
      with:
        name: Toolchain-Download
        path: pi32.zip
