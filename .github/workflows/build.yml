name: Compile FM-1 Worship Firmware

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: windows-latest
    
    steps:
    - name: Checkout your custom code
      uses: actions/checkout@v4

    - name: Clone the official M-VAVE SDK
      run: git clone https://github.com/m-vave/fm1_open.git sdk

    - name: Inject your C++ file into the SDK
      run: |
        Remove-Item -Path ".\sdk\app\main.c" -ErrorAction SilentlyContinue
        Copy-Item -Path ".\ai_studio_code.cpp" -Destination ".\sdk\app\main.cpp" -Force

    - name: Download the official JieLi Toolchain
      run: |
        Invoke-WebRequest -Uri "https://pkgman.jieliapp.com/s/win-toolchain" -OutFile "jieli_installer.exe"
        # Extract the official Windows installer using 7-Zip
        7z x jieli_installer.exe -o"C:\JL\pi32" -y
        
    - name: Compile the Firmware
      run: |
        cd sdk
        # Dynamically find the compiler path in case the installer nested the folders
        $ClangPath = (Get-ChildItem -Path "C:\JL\pi32" -Filter "clang.exe" -Recurse).DirectoryName
        .\Build.ps1 -FirmwareOnly -Toolchain $ClangPath

    - name: Upload the final .fwsc file
      uses: actions/upload-artifact@v4
      with:
        name: FM1-Ambient-Pads
        path: sdk/out/*.fwsc
